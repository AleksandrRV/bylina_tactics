name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release versions
        run: pnpm check:versions

      - name: Check visual-state baselines
        run: pnpm visual:regression

      - name: Run visual accessibility audit
        run: pnpm audit:visual
